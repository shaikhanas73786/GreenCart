<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f8f3"/>
      <stop offset="100%" stop-color="#e2ede3"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b874c"/>
      <stop offset="100%" stop-color="#245530"/>
    </linearGradient>
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2F6B3D"/>
      <stop offset="100%" stop-color="#1f4728"/>
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89658"/>
      <stop offset="100%" stop-color="#a47234"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2F6B3D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient Circle Glow -->
  <circle cx="200" cy="200" r="160" fill="url(#bgGrad)"/>

  <!-- Backpack Body -->
  <g filter="url(#dropShadow)">
    <!-- Top Handle -->
    <path d="M 160 120 C 160 85, 240 85, 240 120" fill="none" stroke="url(#leatherGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Main Pack Body -->
    <rect x="125" y="115" width="150" height="195" rx="30" fill="url(#bagGrad)"/>

    <!-- Top Flap -->
    <path d="M 125 145 C 125 125, 275 125, 275 145 L 275 185 C 275 195, 260 205, 200 205 C 140 205, 125 195, 125 185 Z" fill="#295d35"/>

    <!-- Leather Buckle Straps -->
    <rect x="155" y="130" width="14" height="85" rx="4" fill="url(#leatherGrad)"/>
    <rect x="231" y="130" width="14" height="85" rx="4" fill="url(#leatherGrad)"/>

    <!-- Buckle Hardware -->
    <rect x="152" y="175" width="20" height="12" rx="3" fill="#f59e0b"/>
    <rect x="228" y="175" width="20" height="12" rx="3" fill="#f59e0b"/>

    <!-- Front Pocket -->
    <rect x="145" y="225" width="110" height="75" rx="14" fill="url(#pocketGrad)"/>
    
    <!-- Front Pocket Leather Accent & Zipper -->
    <path d="M 155 240 L 245 240" stroke="#1c4024" stroke-width="3" stroke-linecap="round"/>
    <circle cx="200" cy="265" r="14" fill="url(#leatherGrad)"/>
    <path d="M 197 265 L 203 265" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Side Pockets -->
    <path d="M 125 210 L 116 230 C 114 260, 114 275, 125 285 Z" fill="#245530"/>
    <path d="M 275 210 L 284 230 C 286 260, 286 275, 275 285 Z" fill="#245530"/>
  </g>

  <!-- Green leaf eco emblem -->
  <g transform="translate(192, 140) scale(0.7)">
    <path d="M12 2C6.5 2 2 6.5 2 12c0 4.4 2.9 8.2 7 9.5V14H6v-3h3V8.5C9 5.5 10.8 4 13.5 4c1.3 0 2.5.1 2.5.1v3h-1.4c-1.5 0-2 .9-2 1.9V11h3.4l-.5 3h-2.9v7.5c4.1-1.3 7-5.1 7-9.5 0-5.5-4.5-10-10-10z" fill="none"/>
  </g>
</svg>
